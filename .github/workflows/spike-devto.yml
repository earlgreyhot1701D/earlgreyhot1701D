# SPIKE: prove an Action can fetch DEV posts, draw an SVG, and commit it.
# Runs only on the spike branch. Delete this file if the spike fails.
name: spike-devto-panel

on:
  push:
    branches: [spike/devto-panel]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spike-devto-panel
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Draw panel
        run: python3 scripts/devto_panel.py

      - name: Commit panel if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add assets/spike-devto.svg
          if git diff --cached --quiet; then
            echo "No change to commit."
          else
            git commit -m "spike: redraw DEV panel"
            git push
          fi
