# Redraws the profile panels from the DEV and GitHub APIs.
# Edit data/profile.json or scripts/profile/ to change content; this job does the rest.
name: redraw-profile

on:
  schedule:
    - cron: "23 14 * * *"   # daily, 6:23 AM Pacific (off the top of the hour to dodge queue delays)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/profile.json"
      - "scripts/profile/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: redraw-profile
  cancel-in-progress: true

jobs:
  redraw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Build panels and README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/profile/build.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add README.md assets data/live-cache.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "redraw: sensor sweep $(date -u +%F)"
            git push
          fi
